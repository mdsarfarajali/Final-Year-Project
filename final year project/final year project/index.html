<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Browser Noise Reduction</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Noise Reduction in Web Browser</h1>

    <div id="backendStatus">
      <img
        id="backendImg"
        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18'><circle cx='9' cy='9' r='8' fill='%23ff4d4d'/></svg>"
        alt="status"
      />
      <span id="backendText">Checking backend...</span>
      <button id="checkBackend">Check backend</button>
    </div>

    <div id="recordControls">
      <button id="startBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop Recording</button>
    </div>

    <div>
      <label for="fileInput">Upload audio file:</label>
      <input id="fileInput" type="file" accept="audio/*" />
    </div>

    <button id="denoiseBtn" disabled>Denoise Audio</button>

    <!-- simplified: render audio blocks from JS to avoid repeating markup -->
    <div id="audioRow"></div>

    <script>
      // render small set of audio blocks to avoid repeated HTML
      (function renderAudioBlocks() {
        const names = ["Original", "Denoised"];
        const row = document.getElementById("audioRow");
        names.forEach((name) => {
          const id = name.toLowerCase();
          const block = document.createElement("div");
          block.className = "audioBlock";
          block.innerHTML = `<h3>${name}</h3><audio id="${id}Audio" controls></audio>`;
          row.appendChild(block);
        });
      })();
    </script>

    <script src="project.js"></script>
  </body>
</html>
